name: Agent QA Suite

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  schedule:
    # Monday & Thursday 2 AM UTC
    - cron: "0 2 * * 1,4"
  workflow_dispatch:
    inputs:
      suite:
        description: "Test suite to run"
        required: true
        default: "pr"
        type: choice
        options:
          - pr
          - nightly
          - weekly
          - pre-release
          - full-suite

permissions:
  pull-requests: write
  contents: read

jobs:
  # ──────────────────────────────────────────────────────────────────────
  # PULL REQUEST: Data Integrity, Parser Resilience, UI Regression
  # ──────────────────────────────────────────────────────────────────────
  pr-data-integrity:
    name: "PR: Data Integrity"
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'pull_request' || 
      (github.event_name == 'workflow_dispatch' && 
       github.event.inputs.suite == 'pr')
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run Data Integrity Agent
        run: |
          npx ts-node agents/runner.ts \
            --agent data-integrity \
            --filePaths="aiadaptation.xml,test-fixtures/*" \
            --strictMode=false
        continue-on-error: false

  pr-parser-resilience:
    name: "PR: Parser Resilience"
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'pull_request' || 
      (github.event_name == 'workflow_dispatch' && 
       github.event.inputs.suite == 'pr')
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run Parser Resilience Agent
        run: |
          npx ts-node agents/runner.ts \
            --agent parser-resilience \
            --testDataPath="test-fixtures/" \
            --edgeCasesEnabled=true
        continue-on-error: false

  pr-ui-regression:
    name: "PR: UI Regression"
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'pull_request' || 
      (github.event_name == 'workflow_dispatch' && 
       github.event.inputs.suite == 'pr')
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Start dev server
        run: |
          npm run dev:vite > /tmp/vite.log 2>&1 &
          npx wait-on http://localhost:5173 --timeout 30000
        timeout-minutes: 1

      - name: Run UI Regression Agent
        run: |
          npx ts-node agents/runner.ts \
            --agent ui-regression \
            --baseUrl="http://localhost:5173"
        timeout-minutes: 5

      - name: Upload Vite logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: vite-logs
          path: /tmp/vite.log

  pr-summary:
    name: "PR: Summary"
    runs-on: ubuntu-latest
    needs: [pr-data-integrity, pr-parser-resilience, pr-ui-regression]
    if: always()
    steps:
      - name: Check results
        run: |
          echo "## QA Results 🎯" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Agent | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Data Integrity | ${{ needs.pr-data-integrity.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Parser Resilience | ${{ needs.pr-parser-resilience.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| UI Regression | ${{ needs.pr-ui-regression.result }} |" >> $GITHUB_STEP_SUMMARY

  # ──────────────────────────────────────────────────────────────────────
  # NIGHTLY: Fitting QA, Results Consistency
  # ──────────────────────────────────────────────────────────────────────
  nightly-fitting-qa:
    name: "Nightly: Fitting QA"
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'schedule' || 
      (github.event_name == 'workflow_dispatch' && 
       github.event.inputs.suite == 'nightly')
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run Fitting QA Agent
        id: fitting-qa
        run: |
          npx ts-node agents/runner.ts \
            --agent fitting-qa \
            --aiadaptationXml="aiadaptation.xml" \
            --strictMode=false
        continue-on-error: true

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fitting-qa-report
          path: .agent-reports/

  nightly-results-consistency:
    name: "Nightly: Results Consistency"
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'schedule' || 
      (github.event_name == 'workflow_dispatch' && 
       github.event.inputs.suite == 'nightly')
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run Results Consistency Agent
        id: results-consistency
        run: |
          npx ts-node agents/runner.ts \
            --agent results-consistency \
            --resultsPath="test-fixtures/results/" \
            --validateQualyPatch=true
        continue-on-error: true

  # ──────────────────────────────────────────────────────────────────────
  # WEEKLY: Electron IPC & Storage, Docs Drift
  # ──────────────────────────────────────────────────────────────────────
  weekly-electron-ipc:
    name: "Weekly: Electron IPC & Storage"
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'schedule' && github.event.schedule == '0 2 * * 1,4') || 
      (github.event_name == 'workflow_dispatch' && 
       github.event.inputs.suite == 'weekly')
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run Electron IPC Agent
        run: |
          npx ts-node agents/runner.ts \
            --agent electron-ipc \
            --electronMainPath="electron/main.mjs" \
            --checkStorageSize=true
        continue-on-error: true

  weekly-docs-drift:
    name: "Weekly: Docs Drift"
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'schedule' && github.event.schedule == '0 2 * * 1,4') || 
      (github.event_name == 'workflow_dispatch' && 
       github.event.inputs.suite == 'weekly')
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run Docs Drift Agent
        run: |
          npx ts-node agents/runner.ts \
            --agent docs-drift \
            --docsPath="docs/" \
            --implementationPath="src/"
        continue-on-error: true

  # ──────────────────────────────────────────────────────────────────────
  # PRE-RELEASE: Full suite
  # ──────────────────────────────────────────────────────────────────────
  pre-release-suite:
    name: "Pre-Release: Full QA Suite"
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' && 
      github.event.inputs.suite == 'pre-release'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run full suite
        run: |
          npx ts-node agents/runner.ts --workflow pre-release

      - name: Upload all reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pre-release-reports
          path: .agent-reports/
          retention-days: 30

  # ──────────────────────────────────────────────────────────────────────
  # FULL SUITE (manual or scheduled)
  # ──────────────────────────────────────────────────────────────────────
  full-suite:
    name: "Full Agent Suite"
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' && 
      github.event.inputs.suite == 'full-suite'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Run all agents
        run: |
          npx ts-node agents/runner.ts --agent all

      - name: Upload comprehensive report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-suite-reports
          path: .agent-reports/
          retention-days: 30

      - name: Create GitHub issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: "🚨 Full Agent Suite Failed",
              body: "Full QA suite failed. Check [workflow run](" +
                    context.server_url + "/" + context.repo.owner + "/" +
                    context.repo.repo + "/actions/runs/" + context.runId + ")",
              labels: ["bug", "qa"]
            });
